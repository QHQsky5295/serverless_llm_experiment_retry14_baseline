schema: relayserve_serverlessllm_calibration_policy_v1

comparison_contract:
  trace_role: calibration512_rate100_disjoint
  rate_scale: 1.0
  gpu_budget: 4
  base_model_only: true
  min_instances: 1
  max_instances: 4
  keep_alive_s: 60
  request_poll_interval_s: 0.005
  cost_model: relayserve_lifecycle_monetary_v1

selection_policy:
  description: >-
    Select the candidate with the smallest worst normalized P95 SLO ratio.
    Break ties by higher TTFT SLO attainment, then higher joint TTFT/TPOT
    attainment, then higher CE.
  ordered_keys:
    - worst_normalized_p95_violation_ascending
    - ttft_slo_attainment_descending
    - joint_slo_attainment_descending
    - ce_descending
  p95_ratio_formula: max(ttft_p95_ms / ttft_slo_ms, tpot_p95_ms / tpot_slo_ms)
  formal_rule: >-
    A calibration selection does not imply a gate pass. Formal results must
    separately report whether both paper P95 targets pass.

models:
  3b:
    paper_slo:
      ttft_p95_ms: 180.0
      tpot_p95_ms: 14.0
    candidates:
      - 8
      - 12
      - 16
      - 20
      - 24
      - 32
    selected_target_concurrency: 16
    calibration_table: paper_artifacts/relayserve_v4/serverlessllm_3b_calibration.csv
    calibration_status: frozen_complete
    formal_status: complete
    formal_run: results/relayserve_continuation/serverlessllm/20260613_serverlessllm_3b_formal4000_t16_k60_v1
    formal_table: paper_artifacts/relayserve_v4/serverlessllm_formal4000.csv
  7b:
    paper_slo:
      ttft_p95_ms: 440.0
      tpot_p95_ms: 32.0
    candidates:
      - 4
      - 8
      - 12
      - 16
    selected_target_concurrency: 8
    calibration_table: paper_artifacts/relayserve_v4/serverlessllm_7b_calibration.csv
    calibration_status: frozen_complete
    formal_status: complete
    formal_run: results/relayserve_continuation/serverlessllm/20260613_serverlessllm_7b_formal4000_t8_k60_v1
    formal_table: paper_artifacts/relayserve_v4/serverlessllm_formal4000.csv
